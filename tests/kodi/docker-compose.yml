services:
  kodi:
    image: matthuisman/kodi-headless:Omega
    container_name: sendspin-kodi-test
    depends_on:
      - sendspin-control-mock
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Pacific/Auckland}"
    ports:
      - "${KODI_JSONRPC_PORT:-18080}:8080"
      - "${KODI_WEB_PORT:-19090}:9090"
      - "${KODI_UDP_PORT:-19777}:9777/udp"
    volumes:
      - ./.runtime/userdata:/config/.kodi/userdata
      - ./.runtime/addons/service.sendspin:/config/.kodi/addons/service.sendspin

  sendspin-control-mock:
    image: python:3.12-slim
    container_name: sendspin-control-mock
    command: ["python", "/app/mock_control_api.py"]
    volumes:
      - ./mock_control_api.py:/app/mock_control_api.py:ro
    ports:
      - "${CONTROL_API_PORT:-59999}:59999"
