name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose whether this is a stable latest release or a pre-release."
        required: true
        type: choice
        options:
          - latest
          - pre-release
        default: latest
      release_notes:
        description: "Optional custom release message. Leave blank to generate notes from changes since the previous release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman

      - name: Build and verify all native architectures
        run: scripts/build_native_backends_all.sh

      - name: Create draft release for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python scripts/release.py --draft --release-type "$RELEASE_TYPE" --notes "$RELEASE_NOTES"
