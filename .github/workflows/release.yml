name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag override. Defaults to v<addon version>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman

      - name: Build and verify all native architectures
        run: scripts/build_native_backends_all.sh

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release.py --publish --tag "$RELEASE_TAG"
          else
            python scripts/release.py --publish
          fi
